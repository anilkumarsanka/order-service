apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-db
  namespace: foodapp
spec:
  replicas: 1
  selector:
    matchLabels: {app: order-db}
  template:
    metadata:
      labels: {app: order-db}
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - {name: POSTGRES_DB, value: orderdb}
            - {name: POSTGRES_USER, value: orderuser}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: db-secret, key: password}}
          ports: [{containerPort: 5432}]
---
apiVersion: v1
kind: Service
metadata:
  name: order-db
  namespace: foodapp
spec:
  selector: {app: order-db}
  ports: [{port: 5432}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: foodapp
spec:
  replicas: 2
  selector:
    matchLabels: {app: order-service}
  template:
    metadata:
      labels: {app: order-service}
    spec:
      containers:
        - name: order-service
          image: order-service:1.0
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 5002}]
          env:
            - {name: DATABASE_URL, value: "jdbc:postgresql://order-db:5432/orderdb"}
            - {name: DB_USER, value: orderuser}
            - name: DB_PASSWORD
              valueFrom: {secretKeyRef: {name: db-secret, key: password}}
            - {name: MENU_SERVICE_URL, value: "http://menu-service:5001"}
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: 5002}
            initialDelaySeconds: 45
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /actuator/health/liveness, port: 5002}
            initialDelaySeconds: 90
            periodSeconds: 15
          resources:
            requests: {cpu: 200m, memory: 384Mi}
            limits: {cpu: 500m, memory: 768Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: foodapp
spec:
  type: NodePort
  selector: {app: order-service}
  ports: [{port: 5002, targetPort: 5002, nodePort: 30002}]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: order-service-hpa
  namespace: foodapp
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: order-service}
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}
